# ANoCo — paper main setting (DINOv3-L/16, Supplementary S1).
# Load with: ANoCoConfig.from_yaml("configs/anoco_dinov3l.yaml")

# ---- Backbone / feature extraction ----
backbone: dinov3_vitl16          # paper main backbone: DINOv3-L/16
# Path to the locally cloned DINOv3 hub repo (github.com/facebookresearch/dinov3).
# Leave empty to read the DINOV3_REPO environment variable instead.
dinov3_repo_dir: ""
# Path to a local DINOv3 checkpoint (.pt / .pth). Leave empty to fetch the official
# LVD-1689M weights via torch.hub, or build one with scripts/convert_dinov3_safetensors.py.
dinov3_weights: ""
layer_index: 17                  # 0-indexed block; "18-th transformer layer" of ViT-L (24 blocks)
n_storage_tokens: 4
apply_norm: true
img_size: 768                    # 768/16 = 48 -> 48x48 = 2304 patches
patch_size: 16
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

# ---- Anchor-driven retrieval (Section 3.2) ----
prefix_rule: stop_first_violation   # or: mask_all (ablation)
retrieve_topk: 200                  # topk(K) instead of full argsort (0 = full argsort)

# ---- Graph / solver (Sections 3.3-3.5) ----
lam: 1.0                         # Lambda_q query stabilisation weight (robust per S2)
clamp_negative_weights: false
eps: 1.0e-8

# ---- Non-conformity scoring (Section 3.6, Eq. 10) ----
score_metric: product           # product | l2 | cos
image_reduction: max            # image-level score = max over patches

# ---- Post-processing (Supplementary S1) ----
gaussian_kernel: 7
gaussian_sigma: 0.8

# ---- Runtime ----
device: cuda
dtype: float32
